<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Explainer Animations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; color: #e8eaf2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #canvas { position: absolute; inset: 0; display: block; }
  .wrap { position: relative; z-index: 20; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p.sub { color: #9aa0bc; font-size: 14px; margin-bottom: 32px; text-align: center; max-width: 560px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
  .card { position: relative; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(15,15,24,0.6); backdrop-filter: blur(10px); padding: 24px; cursor: pointer; transition: transform .2s, border-color .2s; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(56,189,248,0.06), rgba(129,140,248,0.06)); opacity: 0; transition: opacity .2s; }
  .card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,0.5); }
  .card:hover::before { opacity: 1; }
  .card h2 { font-size: 19px; font-weight: 700; margin-bottom: 6px; color: #e8eaf2; }
  .card .desc { font-size: 13px; color: #9aa0bc; line-height: 1.5; margin-bottom: 14px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .card .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #38bdf8; border: 1px solid rgba(56,189,248,0.25); border-radius: 4px; padding: 2px 8px; }
  .card .open { font-size: 12px; font-weight: 700; color: #e8eaf2; display: inline-flex; align-items: center; gap: 6px; }
  .card .open::after { content: "→"; }
  .empty { color: #7a7ea0; font-size: 16px; text-align: center; }
  .hint { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); color: #7a7ea0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body>
<div id="canvas"></div>
<div class="wrap">
  <h1>3D Explainers</h1>
  <p class="sub">Deterministic, seekable Three.js + GSAP animations. Open DevTools and call <code>window.__seek(t)</code> inside any animation.</p>
  <div class="grid" id="grid"></div>
</div>
<div class="hint">GitHub Pages ready — push to <code>gh-pages</code> or enable Pages from <code>main</code></div>

<script type="importmap">
{
  "imports": {}
}
</script>
<script defer src="animations.js"></script>
<script defer>
  (function () {
    const grid = document.getElementById("grid");
    function render() {
      const list = window.ANIMATIONS || [];
      grid.innerHTML = "";
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No animations registered yet. Add entries to /animations.js</div>';
        return;
      }
      list.forEach((a) => {
        const card = document.createElement("a");
        card.href = a.path;
        card.className = "card";
        card.innerHTML = `
          <h2>${a.name}</h2>
          <div class="desc">${a.desc}</div>
          <div class="tags">${(a.tags || []).map(t => '<span class="tag">' + t + '</span>').join("")}</div>
          <div class="open">Open animation</div>
        `;
        grid.appendChild(card);
      });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", render);
    } else {
      render();
    }
  })();
</script>
</body>
</html>
